<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <header>
        <h1>TechWeek 2026 - Inscrição</h1>
        <nav>
            <ul>
            <li><a href="../index.html">Página Inicial</a></li>
            <li><a href="/paginas/programacao.html">Ver P</a></li>
            <li><a href="/paginas/prorgamacao.html">Fazer Inscrição</a></li>
            </ul>

        </nav>
    </header>
    
    <hr>

    <main>
        <h2>Formulário de Participação</h2>
        <p>Preencha os dados abaixo com atenção. Os campos marcados com * são obrigatórios</p>

        <form action="sucesso.html" method="get">
            <fieldset>
            <legend>Dados pessoais</legend>
                <label for="nome"> Nome Completo *</label><br>
                <input type="text" id="nome" name="nome" required minlength="5" placeholder="Digite seu nome"><br><br>
                <label for="email">E-mail Profissional</label>
                <input type="text" id="email" name="email"  required placeholder="seuemail@email.com"><br>
                <label for="nacimento">Data de Nascimento</label>
                <input type="date" id="nascimento" required max="2010-01-01"><br><br>
            </fieldset>
            <br>
            <fieldset>
                <legend>Perfil</legend>

                <label for="experiencia">Nível de Experiência</label><br>
                <select id="experiencie" name="experiencia" required>
                    <option value="">Selecione...</option>
                    <option value="iniciante">Estudante/Iniciante</option>
                    <option value="profissional">Profissional</option>
                </select><br><br>

                <label>
                    <input type="checkbox" name="termos" require>
                    Aceito os termos de Participação no evento. *
                </label>
            </fieldset>
            <br>
            <button type="submit">Confirmar Inscrição</button>
        </form>
    </main>
</body>
</html>
